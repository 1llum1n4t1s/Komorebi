# 更新方針: 毎週月曜09:00（日本時間）、minor/patchを集約、majorは個別PR。
# マージ可否は既定ブランチのDependabot auto-mergeが最新CIで判定します。
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: deps
- package-ecosystem: npm
  directory: /build/scripts
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: deps
- package-ecosystem: nuget
  directories:
  - /depends/AvaloniaEdit/src/AvaloniaEdit
  - /depends/AvaloniaEdit/src/AvaloniaEdit.Demo
  - /depends/AvaloniaEdit/src/AvaloniaEdit.TextMate
  - /depends/AvaloniaEdit/test/AvaloniaEdit.Tests
  - /src
  - /tests/CloneLongPaths.E2E
  - /tests/Komorebi.Tests
  - /tests/Recovery.E2E
  - /tests/UIWorkflow.E2E
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: deps
  allow:
  - dependency-type: all
- package-ecosystem: dotnet-sdk
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '09:00'
    timezone: Asia/Tokyo
  open-pull-requests-limit: 5
  groups:
    minor-and-patch:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  commit-message:
    prefix: deps

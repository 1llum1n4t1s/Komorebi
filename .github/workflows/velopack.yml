name: Velopack
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
jobs:
  velopack:
    strategy:
      matrix:
        # win-x64 / win-arm64 はローカル署名リリース (scripts/release-local.ps1) に移行済み。
        # CI で未署名の win フィードを生成すると、署名済みバイナリを R2 上で上書きして
        # しまうため matrix から除外している (コード署名は SimplySign Desktop 接続が必要で
        # GitHub Actions からは実行できない)。
        include:
          - runtime: osx-arm64
            label: macos-apple-silicon
            os: macos-latest
            mainExe: Komorebi
          - runtime: linux-x64
            label: linux-x64
            os: ubuntu-latest
            mainExe: komorebi
          - runtime: linux-arm64
            label: linux-arm64
            os: ubuntu-latest
            mainExe: komorebi
    name: Velopack ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Checkout app metadata
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            build/resources/app/App.icns
            build/resources/app/App.plist
            build/resources/_common/icons/komorebi.png
      - name: Prepare macOS app metadata
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          sed "s/KOMOREBI_VERSION/${{ inputs.version }}/g" build/resources/app/App.plist > Info.plist
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: komorebi.${{ matrix.runtime }}
          path: publish
      - name: Extract tar
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        run: |
          tar -xf publish/komorebi.${{ matrix.runtime }}.tar -C publish
          rm publish/komorebi.${{ matrix.runtime }}.tar
      - name: Install Velopack CLI
        run: dotnet tool install --global vpk
      - name: Create Velopack package (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        run: >
          vpk pack
          --packId Komorebi
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/_common/icons/komorebi.png
      - name: Create Velopack package (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        run: >
          vpk pack
          --packId Komorebi
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/app/App.icns
          --plist Info.plist
      - name: Upload Velopack artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: velopack.${{ matrix.label }}
          path: artifacts/*
          retention-days: 3

name: Velopack
on:
  workflow_call:
    outputs:
      osx-arm64:
        value: ${{ jobs['velopack'].outputs['osx-arm64'] }}
      linux-x64:
        value: ${{ jobs['velopack'].outputs['linux-x64'] }}
      linux-arm64:
        value: ${{ jobs['velopack'].outputs['linux-arm64'] }}
    inputs:
      build-attempts:
        description: Exact producer attempt for each build runtime
        required: true
        type: string
      version:
        required: true
        type: string
jobs:
  velopack:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      osx-arm64: ${{ steps.artifact-attempt.outputs['osx-arm64'] }}
      linux-x64: ${{ steps.artifact-attempt.outputs['linux-x64'] }}
      linux-arm64: ${{ steps.artifact-attempt.outputs['linux-arm64'] }}
    strategy:
      matrix:
        # win-x64 / win-arm64 はローカル署名リリース (scripts/release-local.ps1) に移行済み。
        # CI で未署名の win フィードを生成すると、署名済みバイナリを R2 上で上書きして
        # しまうため matrix から除外している (コード署名は SimplySign Desktop 接続が必要で
        # GitHub Actions からは実行できない)。
        include:
          - runtime: osx-arm64
            label: macos-apple-silicon
            os: macos-latest
            mainExe: Komorebi
          - runtime: linux-x64
            label: linux-x64
            os: ubuntu-latest
            mainExe: komorebi
          - runtime: linux-arm64
            label: linux-arm64
            os: ubuntu-latest
            mainExe: komorebi
    name: Velopack ${{ matrix.label }}
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'windows-') && format('["{0}"]', matrix.os) || startsWith(matrix.os, 'macos-') && '["self-hosted","macOS","ARM64","m3mb14"]' || endsWith(matrix.os, '-arm') && '["self-hosted","Linux","ARM64","m3mb14"]' || '["self-hosted","Linux","X64","m3mb14"]') }}
    steps:
      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windows = $env:RUNNER_OS -eq 'Windows'
          $sdkVersion = $null
          if (Test-Path global.json) {
            $settings = Get-Content global.json -Raw | ConvertFrom-Json -AsHashtable
            if ($settings.ContainsKey('sdk') -and $settings['sdk'] -is [Collections.IDictionary] -and $settings['sdk'].ContainsKey('version')) {
              $sdkVersion = [string]$settings['sdk']['version']
            }
          }
          $extension = if ($windows) { 'ps1' } else { 'sh' }
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.$extension"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.$extension" -OutFile $installer
          $install = Join-Path $env:RUNNER_TEMP 'dotnet'
          $global:LASTEXITCODE = 0
          if ($windows) {
            if ($sdkVersion) { & $installer -Version $sdkVersion -InstallDir $install }
            else { & $installer -Channel '10.0' -InstallDir $install }
          } else {
            if ($sdkVersion) { & bash $installer --version $sdkVersion --install-dir $install }
            else { & bash $installer --channel '10.0' --install-dir $install }
          }
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK installation failed' }
          $dotnetName = if ($windows) { 'dotnet.exe' } else { 'dotnet' }
          $dotnet = Join-Path $install $dotnetName
          if (-not (Test-Path -LiteralPath $dotnet -PathType Leaf)) { throw '.NET SDK executable is missing' }
          & $dotnet --version
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK version check failed' }
          & $dotnet --info
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK runtime check failed' }
          $install | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$install" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Checkout app metadata
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Prepare macOS app metadata
        if: startsWith(matrix.runtime, 'osx-')
        run: |
          sed "s/KOMOREBI_VERSION/${{ inputs.version }}/g" build/resources/app/App.plist > Info.plist
      - name: Download build artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          R2_ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(inputs.build-attempts)[matrix.runtime] }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'komorebi.${{ matrix.runtime }}' -Destination 'publish' -RunAttempt $env:R2_ARTIFACT_RUN_ATTEMPT
        working-directory: ${{ github.workspace }}
      - name: Extract tar
        if: ${{ !startsWith(matrix.runtime, 'win-') }}
        run: |
          tar -xf publish/komorebi.${{ matrix.runtime }}.tar -C publish
          rm publish/komorebi.${{ matrix.runtime }}.tar
      - name: Install Velopack CLI
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/vpk" vpk
          echo "$RUNNER_TEMP/vpk" >> "$GITHUB_PATH"
      - name: Create Velopack package (Linux)
        if: startsWith(matrix.runtime, 'linux-')
        run: >
          vpk pack
          --packId Komorebi
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/_common/icons/komorebi.png
      - name: Create Velopack package (macOS)
        if: startsWith(matrix.runtime, 'osx-')
        run: >
          vpk pack
          --packId Komorebi
          --packVersion ${{ inputs.version }}
          --mainExe ${{ matrix.mainExe }}
          --packDir publish
          --outputDir artifacts
          --channel ${{ matrix.runtime }}
          --icon build/resources/app/App.icns
          --plist Info.plist
      - name: Upload Velopack artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'velopack.${{ matrix.label }}' -Path 'artifacts/*' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

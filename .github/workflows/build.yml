name: Build
on:
  workflow_call:
    outputs:
      win-x64:
        value: ${{ jobs['build'].outputs['win-x64'] }}
      win-arm64:
        value: ${{ jobs['build'].outputs['win-arm64'] }}
      osx-arm64:
        value: ${{ jobs['build'].outputs['osx-arm64'] }}
      linux-x64:
        value: ${{ jobs['build'].outputs['linux-x64'] }}
      linux-arm64:
        value: ${{ jobs['build'].outputs['linux-arm64'] }}
jobs:
  build:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    outputs:
      win-x64: ${{ steps.artifact-attempt.outputs['win-x64'] }}
      win-arm64: ${{ steps.artifact-attempt.outputs['win-arm64'] }}
      osx-arm64: ${{ steps.artifact-attempt.outputs['osx-arm64'] }}
      linux-x64: ${{ steps.artifact-attempt.outputs['linux-x64'] }}
      linux-arm64: ${{ steps.artifact-attempt.outputs['linux-arm64'] }}
    strategy:
      matrix:
        include:
          # Windows は VS 2026（MSVC 14.5x）を持つ windows-2025 を使う。
          # windows-2022 の VS 2022（MSVC 14.44）リンカーは .NET 11 Native AOT の win-arm64 出力で
          # LNK1322（Cortex-A53 erratum 843419 の回避不能）になり、リリース全体が止まるため。
          - name: Windows x64
            os: windows-2025
            runtime: win-x64
          - name: Windows ARM64
            os: windows-2025
            runtime: win-arm64
          - name: macOS (Apple Silicon)
            os: macos-latest
            runtime: osx-arm64
          - name: Linux
            os: ubuntu-24.04
            runtime: linux-x64
          - name: Linux (arm64)
            os: ubuntu-24.04
            runtime: linux-arm64
    name: Build ${{ matrix.name }}
    runs-on: ${{ fromJSON(startsWith(matrix.os, 'macos-') && '["self-hosted","macOS","ARM64","m3mb14"]' || format('["{0}"]', matrix.os)) }}
    steps:
      - name: Install Linux build dependencies
        if: startsWith(matrix.runtime, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $windows = $env:RUNNER_OS -eq 'Windows'
          $sdkVersion = $null
          if (Test-Path global.json) {
            $settings = Get-Content global.json -Raw | ConvertFrom-Json -AsHashtable
            if ($settings.ContainsKey('sdk') -and $settings['sdk'] -is [Collections.IDictionary] -and $settings['sdk'].ContainsKey('version')) {
              $sdkVersion = [string]$settings['sdk']['version']
            }
          }
          $extension = if ($windows) { 'ps1' } else { 'sh' }
          $installer = Join-Path $env:RUNNER_TEMP "dotnet-install.$extension"
          Invoke-WebRequest "https://dot.net/v1/dotnet-install.$extension" -OutFile $installer
          $install = Join-Path $env:RUNNER_TEMP 'dotnet'
          $global:LASTEXITCODE = 0
          if ($windows) {
            if ($sdkVersion) { & $installer -Version $sdkVersion -InstallDir $install }
            else { & $installer -Channel '11.0' -InstallDir $install }
          } else {
            if ($sdkVersion) { & bash $installer --version $sdkVersion --install-dir $install }
            else { & bash $installer --channel '11.0' --install-dir $install }
          }
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK installation failed' }
          $dotnetName = if ($windows) { 'dotnet.exe' } else { 'dotnet' }
          $dotnet = Join-Path $install $dotnetName
          if (-not (Test-Path -LiteralPath $dotnet -PathType Leaf)) { throw '.NET SDK executable is missing' }
          & $dotnet --version
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK version check failed' }
          & $dotnet --info
          if ($LASTEXITCODE -ne 0) { throw '.NET SDK runtime check failed' }
          $install | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$install" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Configure arm64 cross-compilation
        if: matrix.runtime == 'linux-arm64'
        run: |
          sudo dpkg --add-architecture arm64
          CODENAME=$(. /etc/os-release && echo "$VERSION_CODENAME")

          # arm64 パッケージ用の ports リポジトリを追加する
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME} main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-updates main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-security main restricted
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${CODENAME}-backports main restricted" \
          | sudo tee /etc/apt/sources.list.d/arm64.list

          # 既存ソースを amd64 に制限する（DEB822 形式と従来形式の両方に対応）
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          sudo sed -i -e 's/^deb http/deb [arch=amd64] http/g' /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i -e 's/^deb mirror/deb [arch=amd64] mirror/g' /etc/apt/sources.list 2>/dev/null || true

          sudo apt-get update
          sudo apt-get install -y llvm gcc-aarch64-linux-gnu
      - name: Publish
        run: dotnet publish src/Komorebi.csproj -c Release -o publish -r ${{ matrix.runtime }} -p:RestoreLockedMode=true
      - name: Rename executable file
        if: startsWith(matrix.runtime, 'linux-')
        run: mv publish/Komorebi publish/komorebi
      - name: Tar artifact
        if: startsWith(matrix.runtime, 'linux-') || startsWith(matrix.runtime, 'osx-')
        run: |
          tar -cvf "komorebi.${{ matrix.runtime }}.tar" -C publish .
          rm -r publish/*
          mv "komorebi.${{ matrix.runtime }}.tar" publish
      - name: Upload artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'komorebi.${{ matrix.runtime }}' -Path 'publish/*' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

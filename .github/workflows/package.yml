name: Package
on:
  workflow_call:
    outputs:
      win-x64:
        value: ${{ jobs['windows'].outputs['win-x64'] }}
      win-arm64:
        value: ${{ jobs['windows'].outputs['win-arm64'] }}
      osx-arm64:
        value: ${{ jobs['osx-app'].outputs['osx-arm64'] }}
      linux-x64:
        value: ${{ jobs['linux'].outputs['linux-x64'] }}
      linux-arm64:
        value: ${{ jobs['linux'].outputs['linux-arm64'] }}
    inputs:
      build-attempts:
        description: Exact producer attempt for each build runtime
        required: true
        type: string
      version:
        description: Komorebi package version
        required: true
        type: string
jobs:
  windows:
    outputs:
      win-x64: ${{ steps.artifact-attempt.outputs['win-x64'] }}
      win-arm64: ${{ steps.artifact-attempt.outputs['win-arm64'] }}
    name: Package Windows
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - runtime: win-x64
            label: windows-x64
          - runtime: win-arm64
            label: windows-arm64
    steps:
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Download build
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          R2_ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(inputs.build-attempts)[matrix.runtime] }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'komorebi.${{ matrix.runtime }}' -Destination 'build/Komorebi' -RunAttempt $env:R2_ARTIFACT_RUN_ATTEMPT
        working-directory: ${{ github.workspace }}
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
          LABEL: ${{ matrix.label }}
        run: ./build/scripts/package.win.ps1
      - name: Upload package artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'package.${{ matrix.label }}' -Path 'build/komorebi_*.zip' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  osx-app:
    outputs:
      osx-arm64: ${{ steps.artifact-attempt.outputs['osx-arm64'] }}
    name: Package macOS
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - runtime: osx-arm64
            label: macos-apple-silicon
    steps:
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Download build
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          R2_ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(inputs.build-attempts)[matrix.runtime] }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'komorebi.${{ matrix.runtime }}' -Destination 'build' -RunAttempt $env:R2_ARTIFACT_RUN_ATTEMPT
        working-directory: ${{ github.workspace }}
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir build/Komorebi
          tar -xf "build/komorebi.${{ matrix.runtime }}.tar" -C build/Komorebi
          ./build/scripts/package.osx-app.sh
      - name: Upload package artifact
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'package.${{ matrix.label }}' -Path 'build/komorebi_*.zip' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
  linux:
    outputs:
      linux-x64: ${{ steps.artifact-attempt.outputs['linux-x64'] }}
      linux-arm64: ${{ steps.artifact-attempt.outputs['linux-arm64'] }}
    name: Package Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: linux-x64
            label: linux-x64
          - runtime: linux-arm64
            label: linux-arm64
    steps:
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot desktop-file-utils rpm libfuse2
      - name: Download build
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          R2_ARTIFACT_RUN_ATTEMPT: ${{ fromJSON(inputs.build-attempts)[matrix.runtime] }}
        run: |
          & ./scripts/Receive-ReleaseArtifact.ps1 -Name 'komorebi.${{ matrix.runtime }}' -Destination 'build' -RunAttempt $env:R2_ARTIFACT_RUN_ATTEMPT
        working-directory: ${{ github.workspace }}
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          LABEL: ${{ matrix.label }}
          RUNTIME: ${{ matrix.runtime }}
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir build/Komorebi
          tar -xf "build/komorebi.${{ matrix.runtime }}.tar" -C build/Komorebi
          ./build/scripts/package.linux.sh
      - name: Upload package artifacts
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          . ./scripts/R2Artifact.Common.ps1
          Publish-R2Artifact -AccountId $env:R2_ARTIFACT_ACCOUNT_ID -Bucket $env:R2_ARTIFACT_BUCKET -AccessKeyId $env:R2_ARTIFACT_ACCESS_KEY_ID -SecretAccessKey $env:R2_ARTIFACT_SECRET_ACCESS_KEY -Name 'package.${{ matrix.label }}' -Path 'build/komorebi-*.AppImage', 'build/komorebi_*.deb', 'build/komorebi-*.rpm' | Out-Null
        working-directory: ${{ github.workspace }}
      - name: Record artifact producer attempt
        id: artifact-attempt
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          ARTIFACT_RUNTIME: ${{ matrix.runtime }}
        run: |
          printf '%s=%s\n' "$ARTIFACT_RUNTIME" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

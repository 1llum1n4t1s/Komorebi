name: Localization Check
on:
  push:
    branches: [main]
    paths:
      - 'src/Resources/Locales/**'
      - 'build/scripts/**'
      - 'tests/Localization.E2E/**'
      - '.github/workflows/localization-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Resources/Locales/**'
      - 'build/scripts/**'
      - 'tests/Localization.E2E/**'
      - '.github/workflows/localization-check.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  localization-check:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, ARM64, m3mb14]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up native Bun
        shell: pwsh
        run: ./build/scripts/Initialize-BunBuild.ps1 -VersionFile build/scripts/package.json

      - name: Install dependencies
        working-directory: build/scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify failure and write protection
        env:
          KOMOREBI_LOCALIZATION_ARTIFACTS: ${{ runner.temp }}
        run: |
          bun test tests/Localization.E2E/Run.test.mjs
          bun tests/Localization.E2E/Run.mjs --artifacts "$RUNNER_TEMP"

      - name: Run localization check
        run: bun build/scripts/localization-check.js

      - name: Verify no changes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Localization files need updating. Run 'bun build/scripts/localization-check.js' locally and commit the changes."
            git diff --stat
            exit 1
          fi

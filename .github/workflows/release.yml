name: Release
on:
  push:
    branches:
      - 'release/**'
# 通常リリースは R2 単独配信で GitHub Releases を作らないため最小権限化する。
# 旧 GithubSource クライアント救済の "踏み台" は /transfer-cf 移行作業時に
# GitHub Releases へ 1 バージョン (v1.0.81) だけ publish 済み (継続配信はしない)。
permissions:
  contents: read
# 複数 release/** push が overlap した場合、古い run の cleanup step が新しい run が
# upload した object を「keep set 外」として誤削除する race condition が起き得るため、
# release ジョブを workflow level で直列化する。cancel-in-progress: false にする理由は
# 削除途中で中断するとオブジェクト整合性が壊れるためで、走っている run を最後まで完走させて
# 次の run を queue する。
concurrency:
  group: release-r2
  cancel-in-progress: false
jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    secrets: inherit
  version:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Prepare version string
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Output version string
        id: version
        run: |
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
  package:
    needs: [build, version]
    name: Package
    uses: ./.github/workflows/package.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      build-attempts: ${{ toJSON(needs.build.outputs) }}
  velopack:
    needs: [build, version]
    name: Velopack
    uses: ./.github/workflows/velopack.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}
      build-attempts: ${{ toJSON(needs.build.outputs) }}
  r2-upload:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: [build, package, velopack, version]
    name: R2 Upload
    runs-on: [self-hosted, Linux, ARM64, m3mb14]
    # R2 が唯一の配信元 (通常リリースは /vava → R2 単独)。
    # Velopack 自動更新成果物 (nupkg/RELEASES/releases.json/Setup/AppImage/Portable.zip) と
    # standalone パッケージ (deb/rpm/独自zip) の両方を R2 にアップロードする。
    permissions:
      contents: read
    steps:
      - name: Checkout release verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" submodule update --init --recursive
        working-directory: ${{ github.workspace }}
      - name: Download Velopack artifacts
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          BUILD_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.build.outputs) }}
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          VELOPACK_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: |
          $attempts = @{
            build = ($env:BUILD_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            package = ($env:PACKAGE_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            velopack = ($env:VELOPACK_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
          }
          $origins = @(
            @{ Name = 'velopack.macos-apple-silicon'; Runtime = 'osx-arm64'; Producer = 'velopack' },
            @{ Name = 'velopack.linux-x64'; Runtime = 'linux-x64'; Producer = 'velopack' },
            @{ Name = 'velopack.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'velopack' }
          )
          foreach ($origin in $origins) {
            $attempt = $attempts[$origin.Producer][$origin.Runtime]
            & ./scripts/Receive-ReleaseArtifact.ps1 -Name $origin.Name -Destination 'packages' -RunAttempt $attempt
          }
        working-directory: ${{ github.workspace }}
      - name: Download package artifacts
        shell: pwsh
        env:
          R2_ARTIFACT_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ARTIFACT_BUCKET: ${{ vars.R2_ARTIFACT_BUCKET }}
          R2_ARTIFACT_ACCESS_KEY_ID: ${{ secrets.R2_ARTIFACT_ACCESS_KEY_ID }}
          R2_ARTIFACT_SECRET_ACCESS_KEY: ${{ secrets.R2_ARTIFACT_SECRET_ACCESS_KEY }}
          BUILD_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.build.outputs) }}
          PACKAGE_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.package.outputs) }}
          VELOPACK_ARTIFACT_ATTEMPTS: ${{ toJSON(needs.velopack.outputs) }}
        run: |
          $attempts = @{
            build = ($env:BUILD_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            package = ($env:PACKAGE_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
            velopack = ($env:VELOPACK_ARTIFACT_ATTEMPTS | ConvertFrom-Json -AsHashtable)
          }
          $origins = @(
            @{ Name = 'package.windows-x64'; Runtime = 'win-x64'; Producer = 'package' },
            @{ Name = 'package.windows-arm64'; Runtime = 'win-arm64'; Producer = 'package' },
            @{ Name = 'package.macos-apple-silicon'; Runtime = 'osx-arm64'; Producer = 'package' },
            @{ Name = 'package.linux-x64'; Runtime = 'linux-x64'; Producer = 'package' },
            @{ Name = 'package.linux-arm64'; Runtime = 'linux-arm64'; Producer = 'package' }
          )
          foreach ($origin in $origins) {
            $attempt = $attempts[$origin.Producer][$origin.Runtime]
            & ./scripts/Receive-ReleaseArtifact.ps1 -Name $origin.Name -Destination 'packages' -RunAttempt $attempt
          }
        working-directory: ${{ github.workspace }}
      - name: List artifacts
        run: ls -lh packages/
      - name: Verify final packages before upload
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm rpm2cpio squashfs-tools libarchive-tools
          python3 build/scripts/verify-release-artifacts.py --packages packages --version "$RELEASE_VERSION" --source-sha "$RELEASE_SOURCE_SHA"
      # R2 アップロード仕様:
      # - releases.{channel}.json (manifest) は同 channel の旧版を冪等に上書き
      #   → 新リリース後、クライアントはここから新 nupkg URL を取得する
      # - *.nupkg (full/delta) は put のみで既存ファイルは触らない (アップロード時点)
      # - Setup/AppImage/Portable.zip と deb/rpm/独自zip は固定名/バージョン名で put
      # - リリース完了後、後段の Cleanup step が「今 upload したファイル一式」以外を全削除する
      #   → R2 は常に最新 1 バージョンのみ保持。旧 delta は manifest からも消えているため
      #     クライアントは最新フル nupkg を取得して追いつく
      - name: Publish verified artifacts to R2
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          . ./scripts/R2Distribution.Common.ps1
          $files = @(Get-ChildItem -Path 'packages' -File)
          $metadata = '^(?:releases\..*\.json|assets\..*\.json|RELEASES(?:-.*)?)$'
          $ordered = @($files | Where-Object { $_.Name -notmatch $metadata }) + @($files | Where-Object { $_.Name -match $metadata })
          foreach ($file in $ordered) {
            $immutable = $file.Name -match '(?:\.nupkg$|[-_.]\d+\.\d+\.\d+(?:[-_.]|$))'
            $cacheControl = if ($immutable) { 'public, max-age=31536000, immutable' } else { 'no-cache, must-revalidate' }
            $contentType = switch -Regex ($file.Name) { '\.json$' { 'application/json'; break }; '^RELEASES' { 'text/plain'; break }; '\.(zip|nupkg)$' { 'application/zip'; break }; default { 'application/octet-stream' } }
            Publish-R2Object -AccountId $env:CLOUDFLARE_ACCOUNT_ID -Bucket 'komorebi-updates' -FilePath $file.FullName -Immutable:$immutable -CacheControl $cacheControl -ContentType $contentType | Out-Null
          }
      # 旧バージョン成果物のクリーンアップ:
      # - 今リリースで packages/ にアップロードしたファイル名群を keep set として、それ以外を削除
      # - 対象: 旧 Velopack nupkg (full/delta)、旧 Setup.exe / Portable.zip / AppImage、
      #   旧 standalone パッケージ (komorebi_<old>_*.zip / .deb / .rpm) すべて
      # - 明示保護: releases.*.json / assets.*.json / RELEASES* (manifest 系。今回も upload
      #   されるので keep set にも入るが、二重保護で取りこぼし防止)
      # - R2 は常に「最新リリースで配ったファイル一式」のみ保持する状態に揃う
      # - keep set は public endpoint ではなくローカル packages/ から構築 (CDN 伝播遅延の race condition を回避)
      # - 全成果物のアップロード完了後にローカル packages/ の keep set で実行する
      - name: Cleanup old artifacts (keep only files just uploaded)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/komorebi-updates"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          # 1. keep_map を packages/ (= 今アップロードしたファイル一式) から構築
          declare -A keep_map
          shopt -s nullglob
          for f in packages/*; do
            [ -f "$f" ] || continue
            keep_map["$(basename "$f")"]=1
          done
          shopt -u nullglob

          if [[ "${#keep_map[@]}" -eq 0 ]]; then
            echo "::error::packages/ にファイルがありません。Velopack/package 成果物のダウンロードに失敗している可能性があります。"
            exit 1
          fi

          echo "::group::keep_map (今リリースで配った成果物 / 削除対象から除外) (${#keep_map[@]} files)"
          for k in "${!keep_map[@]}"; do echo "  $k"; done | sort
          echo "::endgroup::"

          # 2. R2 上の全 object を cursor pagination で取得
          all_keys=()
          cursor=""
          while true; do
            if [[ -n "$cursor" ]]; then
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000&cursor=${cursor}" -H "$auth_header")
            else
              resp=$(curl --fail --silent --max-time 30 "${api}/objects?per_page=1000" -H "$auth_header")
            fi
            while IFS= read -r k; do
              [[ -n "$k" ]] && all_keys+=("$k")
            done < <(echo "$resp" | jq -r '.result[]?.key')
            truncated=$(echo "$resp" | jq -r '.result_info.is_truncated // false')
            [[ "$truncated" != "true" ]] && break
            cursor=$(echo "$resp" | jq -r '.result_info.cursor // ""')
            [[ -z "$cursor" || "$cursor" == "null" ]] && break
          done

          echo "::group::R2 内全オブジェクト (${#all_keys[@]} files)"
          printf '  %s\n' "${all_keys[@]}"
          echo "::endgroup::"

          # 3. 削除対象判定:
          #    - keep_map に含まれる (今リリースで配った) ものは保護
          #    - 固定 manifest 系 (releases.*.json / assets.*.json / RELEASES*) は明示保護
          #      → 今回も upload されるので keep_map にも入るが、取りこぼし防止の二重保護
          #    - Windows 成果物はローカル署名リリース側だけが cleanup する。
          #      CI とローカルリリースが並行した際、更新途中の remote manifest を基準にすると
          #      相手が直前に upload した新 nupkg を誤削除するため、CI では全世代を保護する。
          #    - バージョン付きファイルは直近 KEEP_VERSIONS 世代を保護する (全プロジェクト共通
          #      ポリシー)。旧実装は keep_map = 今リリース分のみ = 実質 1 世代しか残さなかった。
          #      現行版 + 1 つ前を残すと、配信直後の伝播中クライアントが 1 つ前を引ける。
          #    - Windows のバージョン付き zip (komorebi_x.y.z.windows-*.zip) も保護対象に追加。
          #      旧 case は Komorebi-win-* (大文字) しか挙げておらず、ローカル署名リリースが
          #      上げた Windows zip を CI が消しうる非対称があった。
          #    - grep が無一致で終わると pipefail で job が落ちるため || true で吸収する。
          KEEP_VERSIONS=2
          declare -A keep_version_map
          mapfile -t all_versions < <(printf '%s\n' "${all_keys[@]}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | sort -V -u || true)
          if [[ "${#all_versions[@]}" -gt 0 ]]; then
            start=$(( ${#all_versions[@]} - KEEP_VERSIONS ))
            (( start < 0 )) && start=0
            for v in "${all_versions[@]:$start}"; do keep_version_map["$v"]=1; done
          fi
          echo "保持バージョン: ${!keep_version_map[*]} (R2 上の全 ${#all_versions[@]} 世代のうち直近 ${KEEP_VERSIONS} 世代)"

          to_delete=()
          for key in "${all_keys[@]}"; do
            [[ -n "${keep_map[$key]:-}" ]] && continue
            case "$key" in
              releases.*.json|assets.*.json|RELEASES*|Komorebi-win-*|komorebi_*.windows-*|Komorebi-*-win-x64-*.nupkg|Komorebi-*-win-arm64-*.nupkg) continue ;;
            esac
            # 固定ファイル名 (バージョン文字列なし) は毎リリース上書きされるので保持
            ver=$(printf '%s' "$key" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)
            [[ -z "$ver" ]] && continue
            [[ -n "${keep_version_map[$ver]:-}" ]] && continue
            to_delete+=("$key")
          done

          if [[ "${#to_delete[@]}" -eq 0 ]]; then
            echo "✅ 削除対象なし - R2 上の全オブジェクトが今リリースの成果物か保護対象です"
            exit 0
          fi

          echo "::group::削除対象 (${#to_delete[@]} files)"
          printf '  %s\n' "${to_delete[@]}"
          echo "::endgroup::"

          # 4. 一個ずつ DELETE (--max-time 30 でハング防止)
          deleted=0
          failed=0
          for key in "${to_delete[@]}"; do
            encoded=$(jq -nr --arg k "$key" '$k|@uri')
            resp=$(curl --silent --max-time 30 -X DELETE "${api}/objects/${encoded}" -H "$auth_header")
            success=$(echo "$resp" | jq -r '.success')
            if [[ "$success" == "true" ]]; then
              echo "  🗑️  Deleted: $key"
              deleted=$((deleted + 1))
            else
              echo "  ❌ Failed: $key"
              echo "$resp" | jq -r '.errors[]?.message' | sed 's/^/      /'
              failed=$((failed + 1))
            fi
          done

          echo ""
          echo "🧹 R2 クリーンアップ完了: $deleted / ${#to_delete[@]} 削除  (失敗: $failed)"
          # 削除失敗は次回リリースで再試行されるため、リリース自体は成功扱い。
          # ただし全件失敗の場合は権限/bucket 名の問題なのでワークフロー失敗にする。
          if [[ "$failed" -gt 0 && "$deleted" -eq 0 ]]; then
            echo "::error::すべての削除が失敗しました。API token の権限・bucket 名を確認してください。"
            exit 1
          fi